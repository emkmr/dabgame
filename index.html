<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DaB GAME</title>
<link rel="icon" type="image/png" href="assets/app-icon.png">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<meta name="apple-mobile-web-app-title" content="DaB GAME">
<style>
@import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap');

:root {
  --ground-color: #FCF07A;
  --ground-dark-color: #FCF07A;
}

body {
  margin: 0;
  padding: 0;
  background: linear-gradient(180deg, #f7e389 0%, #f7e389 15%, #e18448 15%, #e18448 85%, #f7e389 85%, #f7e389 100%);
  overflow: hidden;
  font-family: 'M PLUS Rounded 1c', sans-serif;
  touch-action: none;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
}

#game-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#ui-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.hud {
  padding-top: max(20px, env(safe-area-inset-top) + 20px);
  padding-left: max(20px, env(safe-area-inset-left) + 20px);
  padding-right: max(20px, env(safe-area-inset-right) + 20px);
  padding-bottom: 20px;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  box-sizing: border-box;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 100;
}

#score {
  font-size: 12px;
  color: rgba(51, 51, 51, 0.6);
  background: transparent;
  padding: 2px 0;
  font-weight: bold;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

#dist {
  font-size: 20px;
  color: #2a2620;
  font-weight: 700;
  text-shadow: none;
  background: none;
  border: none;
  padding: 0;
  margin-right: 6px;
}

#start-screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 217, 230, 0.92);
  backdrop-filter: blur(12px);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #333;
  z-index: 200;
  pointer-events: auto;
  padding: max(20px, env(safe-area-inset-top) + 10px) 20px max(30px, env(safe-area-inset-bottom) + 20px);
  box-sizing: border-box;
  overflow-y: auto;
}

.start-btn {
  padding: 18px 60px;
  font-size: 18px;
  font-weight: bold;
  background: #1f1b1a;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 50px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  transition: transform 0.2s, box-shadow 0.2s;
  font-family: inherit;
  white-space: nowrap;
}

.start-btn:active {
  transform: scale(0.95);
  box-shadow: 0 5px 10px rgba(0,0,0,0.1);
}

.overlay-card {
  width: min(360px, calc(100% - 40px));
  border-radius: 28px;
  border: 4px solid #2f4357;
  padding: 34px 26px 40px;
  background: #FFD9E6;
  box-shadow: 0 25px 40px rgba(0,0,0,0.2);
  text-align: center;
  color: #2c2c2c;
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
}

.overlay-video {
  width: 100%;
  max-height: 180px;
  border-radius: 24px;
  overflow: hidden;
  border: 3px solid #1f2d40;
  background: #000;
  box-sizing: border-box;
}

.overlay-video video {
  width: 100%;
  height: 180px;
  display: block;
  object-fit: cover;
}

.overlay-caption {
  font-size: 14px;
  letter-spacing: 0.3em;
  color: rgba(33, 33, 33, 0.8);
  margin-bottom: 18px;
}

.overlay-scene {
  border-radius: 24px;
  border: 3px solid #1f2d40;
  overflow: hidden;
  margin-bottom: 16px;
  background: #8cc0f4;
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.05);
  box-sizing: border-box;
}

.overlay-scene-sky {
  background: #8cc0f4;
  padding: 10px 18px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.overlay-scene-text {
  font-size: 16px;
  color: rgba(34,34,34,0.7);
  letter-spacing: 0.1em;
  margin: 0;
}

.overlay-hand {
  width: 54px;
  height: 54px;
}

.overlay-hand svg {
  width: 100%;
  height: 100%;
}

.overlay-scene-ground {
  background: linear-gradient(0deg, var(--ground-color) 0%, var(--ground-color) 100%);
  padding: 10px 18px 16px;
  position: relative;
  min-height: 70px;
  display: flex;
  align-items: flex-end;
}

.overlay-scene-character {
  width: 72px;
  height: 72px;
  object-fit: contain;
}

.overlay-sound {
  position: absolute;
  left: 20px;
  bottom: 16px;
  font-size: 18px;
  color: #2f2f2f;
}

.overlay-message {
  font-size: 32px;
  margin: 0;
  color: #2e2e2e;
}

.overlay-score-panel {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 18px 0;
  color: #c67b1d;
}

.overlay-score-panel.visible {
  display: flex;
}

.overlay-star {
  font-size: 26px;
}

.overlay-score-text {
  font-size: 16px;
  line-height: 1.2;
}

.overlay-score-value {
  font-size: 36px;
  font-weight: 700;
  display: block;
  color: #2f2b27;
}

.overlay-subtext {
  font-size: 14px;
  color: rgba(33, 33, 33, 0.8);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: nowrap;
}

.overlay-subtext-text {
  font-size: 14px;
  white-space: nowrap;
}

.overlay-subtext-icon {
  width: 36px;
  height: 36px;
  object-fit: contain;
}
</style>
</head>

<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="ui-layer">
    <div class="hud">
      <span id="score">SCORE: 0</span>
      <span id="dist">0</span>
    </div>
  </div>

  <div id="start-screen">
    <div class="overlay-card">
      <p class="overlay-caption">ぴょんぴょんSATOSHI</p>
      <div class="overlay-video" id="overlay-video">
        <video src="assets/DABGAME:assets:img:ui_reference_02.MP4" autoplay muted loop playsinline></video>
      </div>
      <div class="overlay-scene" id="overlay-scene">
        <div class="overlay-scene-sky">
          <p class="overlay-scene-text">タップしてプレイ</p>
          <div class="overlay-hand">
            <svg viewBox="0 0 64 64" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 26v-8a4 4 0 0 1 8 0v9"></path>
              <path d="M28 22v-6a4 4 0 0 1 8 0v10"></path>
              <path d="M36 24v-8a4 4 0 0 1 8 0v16"></path>
              <path d="M44 28v-6a4 4 0 0 1 8 0v20c0 8-6 14-14 14h-4"></path>
              <path d="M18 30c0 10 6 20 10 24"></path>
            </svg>
          </div>
        </div>
        <div class="overlay-scene-ground">
          <img src="assets/start_character.png" alt="runner" class="overlay-scene-character">
          <div class="overlay-sound">🔈</div>
        </div>
      </div>
      <h1 class="overlay-message" id="overlay-message"></h1>

      <div class="overlay-score-panel" id="overlay-score-panel">
        <span class="overlay-star">★</span>
        <div class="overlay-score-text">
          <span>Score</span>
          <span class="overlay-score-value" id="overlay-score-value">0</span>
        </div>
        <span class="overlay-star">★</span>
      </div>

      <p class="overlay-subtext" id="overlay-subtext"></p>
      <button class="start-btn" id="start-btn">PLAY GAME</button>
    </div>
  </div>
</div>

<script>
/**
 * Game Setup
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const startScreenEl = document.getElementById('start-screen');
const overlayMessageEl = document.getElementById('overlay-message');
const overlayScene = document.getElementById('overlay-scene');
const overlayVideo = document.getElementById('overlay-video');
const overlayScorePanel = document.getElementById('overlay-score-panel');
const overlayScoreValue = document.getElementById('overlay-score-value');
const overlaySubtextEl = document.getElementById('overlay-subtext');
const startBtn = document.getElementById('start-btn');

const COLORS = {
  sky: '#FFD9E6',
  ground: '#FCF07A',
  groundDark: '#FCF07A',
  blockQ: '#FFB347',
  pipe: '#FF69B4',
  pipeDark: '#C71585',
  text: '#333333'
};

// ★ マップの縦マス数（y=0..14 と一致）
const ROWS = 15;
const SKULL_SCORE = 150;
const SKULL_JUMP_MULTIPLIER = 1.4;
const INVINCIBLE_DURATION = 480;
const BUBBLE_DURATION = 300;
const HEART_SCORE = 20;
const STAR_SCORE = 20;
const BOTTLE_SCORE = 20;
const GHOST_SCORE = 20;
const SKY_DOG_CHANCE = 0.012;
const SKY_DOG_COOLDOWN_FRAMES = 360;
const PIPE_PERSON_CHANCE = 0.006;
const PIPE_PERSON_COOLDOWN_FRAMES = 300;
const PIPE_PERSON_HIT_COOLDOWN_FRAMES = 1500;
const PIPE_PERSON_FLOAT_OFFSET = 0.18;
const PIPE_CAT_FLOAT_OFFSET = 0.02;
const BEER_MUG_COUNT = 48;
const BEER_DURATION = 120;

const SKY_DOG_CONFIG = {
  baseSpeed: () => Math.max(1.8, view.w * 0.0025),
  yRange: () => ({
    min: view.h * 0.12,
    max: view.h * 0.25
  })
};

// 画面（CSSピクセル基準）
const view = { w: 0, h: 0, dpr: 1 };

// ゲーム定数（初期値）
let TILE_SIZE = 40;
let GRAVITY = 0.6;
let JUMP_FORCE = -12;
let MOVE_SPEED = 5;

let gameState = {
  isRunning: false,
  score: 0,
  distance: 0,
  cameraX: 0
};

let jumpPressed = false;

/**
 * Resize Logic
 */
function getViewportSize() {
  // iOS Safari のアドレスバー伸縮対策
  const vv = window.visualViewport;
  const w = Math.floor(vv?.width ?? window.innerWidth);
  const h = Math.floor(vv?.height ?? window.innerHeight);
  return { w, h };
}

function calculateConstants() {
  // ★ ROWS (=15) と一致させて tile を計算する（床が見えないのに当たり判定だけある問題の主因を除去）
  TILE_SIZE = Math.max(24, Math.floor(view.h / ROWS));

  GRAVITY = TILE_SIZE * 0.03;
  JUMP_FORCE = -(TILE_SIZE * 0.55);
  MOVE_SPEED = TILE_SIZE * 0.12;
}

function resize() {
  const { w, h } = getViewportSize();
  view.w = w;
  view.h = h;
  view.dpr = window.devicePixelRatio || 1;

  // 見た目サイズ
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";

  // 実ピクセル（描画バッファ）
  canvas.width = Math.floor(w * view.dpr);
  canvas.height = Math.floor(h * view.dpr);

  // 座標系は CSSピクセルで扱えるようにする
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);

  if (!gameState.isRunning) {
    calculateConstants();
  }
}

window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

/**
 * Drawing Functions
 */
function drawInvincibleStars(ctx, w, h, frame) {
  const starCount = 26;
  const baseOrbit = Math.min(w, h) * 1.05;
  const time = frame * 0.035;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  for (let i = 0; i < starCount; i++) {
    const t = i / starCount;
    const angle = t * Math.PI * 2 + time * 1.15 + Math.sin(time + i) * 0.2;
    const wobble = Math.sin(time * 1.6 + i) * w * 0.08;
    const orbit = baseOrbit + wobble;
    const size = Math.max(6, w * (0.07 + (i % 6) * 0.012));
    const sx = w / 2 + Math.cos(angle) * orbit;
    const sy = h * 0.55 + Math.sin(angle) * orbit * 0.55;
    const pulse = 1 + Math.sin(time * 2 + i) * 0.08;

    drawStar(ctx, sx - size * 0.5, sy - size * 0.5, size * pulse, frame);
  }

  const outerCount = 18;
  const outerOrbit = baseOrbit * 1.35;
  for (let k = 0; k < outerCount; k++) {
    const t = k / outerCount;
    const angle = t * Math.PI * 2 - time * 0.9 + Math.cos(time + k) * 0.2;
    const wobble = Math.cos(time * 1.4 + k) * w * 0.1;
    const orbit = outerOrbit + wobble;
    const size = Math.max(6, w * (0.08 + (k % 5) * 0.012));
    const sx = w / 2 + Math.cos(angle) * orbit;
    const sy = h * 0.55 + Math.sin(angle) * orbit * 0.58;
    const pulse = 1 + Math.sin(time * 1.6 + k) * 0.06;

    drawStar(ctx, sx - size * 0.5, sy - size * 0.5, size * pulse, frame);
  }

  const outerMostCount = 12;
  const outerMostOrbit = baseOrbit * 1.62;
  for (let m = 0; m < outerMostCount; m++) {
    const t = m / outerMostCount;
    const angle = t * Math.PI * 2 + time * 0.7 + Math.sin(time + m) * 0.15;
    const wobble = Math.sin(time * 1.2 + m) * w * 0.12;
    const orbit = outerMostOrbit + wobble;
    const size = Math.max(5, w * (0.07 + (m % 4) * 0.01));
    const sx = w / 2 + Math.cos(angle) * orbit;
    const sy = h * 0.55 + Math.sin(angle) * orbit * 0.62;
    const pulse = 1 + Math.sin(time * 1.4 + m) * 0.05;

    drawStar(ctx, sx - size * 0.5, sy - size * 0.5, size * pulse, frame);
  }

  const outerPlusCount = 10;
  const outerPlusOrbit = baseOrbit * 1.85;
  for (let n = 0; n < outerPlusCount; n++) {
    const t = n / outerPlusCount;
    const angle = t * Math.PI * 2 - time * 0.8 + Math.cos(time + n) * 0.18;
    const wobble = Math.cos(time * 1.1 + n) * w * 0.14;
    const orbit = outerPlusOrbit + wobble;
    const size = Math.max(5, w * (0.065 + (n % 3) * 0.01));
    const sx = w / 2 + Math.cos(angle) * orbit;
    const sy = h * 0.55 + Math.sin(angle) * orbit * 0.64;
    const pulse = 1 + Math.sin(time * 1.3 + n) * 0.05;

    drawStar(ctx, sx - size * 0.5, sy - size * 0.5, size * pulse, frame);
  }

  const outerFarCount = 8;
  const outerFarOrbit = baseOrbit * 2.05;
  for (let q = 0; q < outerFarCount; q++) {
    const t = q / outerFarCount;
    const angle = t * Math.PI * 2 + time * 0.6 + Math.sin(time + q) * 0.16;
    const wobble = Math.sin(time * 1.05 + q) * w * 0.16;
    const orbit = outerFarOrbit + wobble;
    const size = Math.max(4, w * (0.055 + (q % 3) * 0.008));
    const sx = w / 2 + Math.cos(angle) * orbit;
    const sy = h * 0.55 + Math.sin(angle) * orbit * 0.66;
    const pulse = 1 + Math.sin(time * 1.2 + q) * 0.05;

    drawStar(ctx, sx - size * 0.5, sy - size * 0.5, size * pulse, frame);
  }

  for (let j = 0; j < 14; j++) {
    const angle = time * 1.8 + j * 0.6;
    const orbit = w * 0.38 + Math.sin(time * 2 + j) * w * 0.06;
    const size = Math.max(4, w * 0.045);
    const sx = w / 2 + Math.cos(angle) * orbit;
    const sy = h * 0.55 + Math.sin(angle) * orbit * 0.45;
    drawStar(ctx, sx - size * 0.5, sy - size * 0.5, size, frame);
  }

  ctx.restore();
}

function drawPlayer(ctx, x, y, frame) {
  const w = TILE_SIZE * 0.9;
  const h = TILE_SIZE * 1.5;

  ctx.save();
  ctx.translate(x, y);

  const ps = w / 12;

  if (isInvincible() && bubbleTimer > 0) {
    drawInvincibleStars(ctx, w, h, frame);
  }

  const c = {
    hair: '#222',
    skin: '#FCD',
    vest: '#2C3E50',
    shirt: '#FFF',
    pants: '#2C3E50'
  };

  const runFrame = Math.floor(frame / 5) % 4;
  let legOffsetL = 0;
  let legOffsetR = 0;

  if (!player.grounded) {
    legOffsetL = -1;
    legOffsetR = -2;
  } else {
    if (runFrame === 0) { legOffsetL = 0; legOffsetR = 0; }
    else if (runFrame === 1) { legOffsetL = -1; legOffsetR = 1; }
    else if (runFrame === 2) { legOffsetL = 0; legOffsetR = 0; }
    else { legOffsetL = 1; legOffsetR = -1; }
  }

  ctx.fillStyle = c.hair;
  ctx.fillRect(ps*2, ps*1, ps*8, ps*10);
  ctx.fillRect(ps*1, ps*3, ps*1, ps*8);

  ctx.fillStyle = c.pants;
  ctx.fillRect(ps*3, ps*11 + legOffsetL * ps, ps*2, ps*4);
  ctx.fillRect(ps*7, ps*11 + legOffsetR * ps, ps*2, ps*4);

  ctx.fillStyle = c.vest;
  ctx.fillRect(ps*3, ps*5, ps*6, ps*6);

  ctx.fillStyle = c.shirt;
  ctx.fillRect(ps*5, ps*5, ps*2, ps*2);
  if(runFrame % 2 === 0 || !player.grounded) {
    ctx.fillRect(ps*2, ps*5, ps*1, ps*4);
    ctx.fillRect(ps*9, ps*5, ps*1, ps*4);
  } else {
    ctx.fillRect(ps*2, ps*4, ps*1, ps*4);
    ctx.fillRect(ps*9, ps*6, ps*1, ps*4);
  }

  ctx.fillStyle = c.skin;
  ctx.fillRect(ps*2, ps*9 + (runFrame%2===0?0:-ps), ps*1, ps*1);
  ctx.fillRect(ps*9, ps*9 + (runFrame%2===0?0:ps), ps*1, ps*1);

  ctx.fillRect(ps*3, ps*1, ps*6, ps*4);

  ctx.fillStyle = c.hair;
  ctx.fillRect(ps*3, 0, ps*6, ps*1);
  ctx.fillRect(ps*3, ps*1, ps*1, ps*3);
  ctx.fillRect(ps*8, ps*1, ps*1, ps*3);
  ctx.fillRect(ps*3, ps*1, ps*2, ps*1);
  ctx.fillRect(ps*7, ps*1, ps*2, ps*1);

  ctx.fillStyle = '#000';
  ctx.fillRect(ps*4, ps*2, ps*1, ps*0.5);
  ctx.fillRect(ps*7, ps*2, ps*1, ps*0.5);
  ctx.fillRect(ps*5, ps*3.5, ps*2, ps*0.5);

  ctx.restore();
}

function drawBlock(ctx, x, y, type, tileX, tileY) {
  if (type === 1) { // Ground
    ctx.fillStyle = COLORS.ground;
    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
    ctx.fillStyle = COLORS.groundDark;
    ctx.fillRect(x, y + TILE_SIZE - 4, TILE_SIZE, 4);
  } else if (type === 2) { // Scissors
    const cx = x + TILE_SIZE/2;
    const cy = y + TILE_SIZE/2;
    const s = TILE_SIZE * 0.7;

    ctx.save();
    ctx.translate(cx, cy);

    ctx.strokeStyle = '#444';
    ctx.lineWidth = s * 0.15;

    ctx.beginPath();
    ctx.arc(-s*0.25, s*0.4, s*0.2, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(s*0.25, s*0.4, s*0.2, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#C0C0C0';
    ctx.beginPath();
    ctx.moveTo(-s*0.25, s*0.2);
    ctx.lineTo(0, -s*0.6);
    ctx.lineTo(s*0.05, s*0.2);
    ctx.moveTo(s*0.25, s*0.2);
    ctx.lineTo(0, -s*0.6);
    ctx.lineTo(-s*0.05, s*0.2);
    ctx.fill();

    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.arc(0, 0, s*0.05, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  } else if (type === 7) { // Bottle (collectible)
    const size = TILE_SIZE * 0.85;
    const bob = Math.sin(frameCount * 0.08 + (tileX * 0.37 + tileY * 0.19)) * TILE_SIZE * 0.03;
    const bx = x + (TILE_SIZE - size) * 0.5;
    const by = y + (TILE_SIZE - size) * 0.5 + bob;
    drawBottleSparkles(ctx, bx, by, size, frameCount, tileX * 13 + tileY * 7);
    drawBottle(ctx, bx, by, size);
  } else if (type === 3) { // Pipe
    const aboveIsPipe = level?.map?.[tileX]?.[tileY - 1] === 3;
    const rimH = Math.max(6, TILE_SIZE * 0.22);
    const bodyH = TILE_SIZE - rimH;
    ctx.fillStyle = '#F2A3B8';
    if (aboveIsPipe) {
      ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
    } else {
      ctx.fillRect(x, y + rimH, TILE_SIZE, bodyH);

      ctx.fillStyle = '#C98297';
      ctx.fillRect(x, y + rimH - 2, TILE_SIZE, 2);

      ctx.fillStyle = '#FFC1D2';
      ctx.fillRect(x, y, TILE_SIZE, rimH);

      ctx.fillStyle = '#6A3C4A';
      ctx.fillRect(x + TILE_SIZE * 0.18, y + rimH * 0.25, TILE_SIZE * 0.64, rimH * 0.5);
    }
  } else if (type === 5) { // Question block
    const inset = TILE_SIZE * 0.08;
    const size = TILE_SIZE - inset * 2;
    ctx.fillStyle = '#98fb98';
    ctx.fillRect(x + inset, y + inset, size, size);
    ctx.strokeStyle = '#8fbc8f';
    ctx.lineWidth = Math.max(2, TILE_SIZE * 0.08);
    ctx.strokeRect(x + inset, y + inset, size, size);
    ctx.fillStyle = '#ee82ee';
    ctx.font = `bold ${Math.floor(TILE_SIZE * 0.62)}px 'M PLUS Rounded 1c', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('?', x + TILE_SIZE / 2, y + TILE_SIZE * 0.52);
  } else if (type === 6) { // Used block
    ctx.fillStyle = '#d8b26a';
    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
    ctx.fillStyle = '#b4884a';
    ctx.fillRect(x, y + TILE_SIZE * 0.78, TILE_SIZE, TILE_SIZE * 0.22);
  } else if (type === 4) { // Skull
    ctx.save();
    ctx.translate(x, y);
    const unit = TILE_SIZE / 16;
    const barH = unit * 2;
    const barW = unit * 12;
    const barX = unit * 2;
    const barTopY = unit * 2;
    const barBottomY = unit * 12;

    // Top / bottom bars
    ctx.fillStyle = '#f4e9db';
    ctx.fillRect(barX, barTopY, barW, barH);
    ctx.fillRect(barX, barBottomY, barW, barH);

    // Spring body (pixel diamond)
    ctx.fillStyle = '#ff4b2b';
    const px = unit;
    const centerX = unit * 8;
    const centerY = unit * 8;
    const pixels = [
      [0, -3], [-1, -2], [1, -2],
      [-2, -1], [2, -1],
      [-3, 0], [3, 0],
      [-2, 1], [2, 1],
      [-1, 2], [1, 2],
      [0, 3]
    ];
    pixels.forEach(([dx, dy]) => {
      ctx.fillRect(centerX + dx * px, centerY + dy * px, px, px);
    });

    // Inner diamond hole
    ctx.fillStyle = '#f7df7a';
    const inner = [
      [0, -1], [-1, 0], [1, 0], [0, 1]
    ];
    inner.forEach(([dx, dy]) => {
      ctx.fillRect(centerX + dx * px, centerY + dy * px, px, px);
    });

    ctx.restore();
  }
}

function drawEnemy(ctx, x, y, frame) {
  const w = TILE_SIZE;
  const h = TILE_SIZE;
  const capBase = '#A79CF8';
  const capShadow = '#857CC6';
  const capHighlight = '#B4A8FF';
  const dotBase = '#9FFCA3';
  const dotShadow = '#7FC982';
  const dotHighlight = '#ABFFB0';
  const stemColor = '#FFF1D6';

  ctx.fillStyle = capBase;
  ctx.beginPath();
  ctx.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI, true);
  ctx.fill();

  ctx.fillStyle = capHighlight;
  ctx.beginPath();
  ctx.ellipse(x + w * 0.38, y + h * 0.38, w * 0.18, h * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();

  const drawDot = (cx, cy, r) => {
    ctx.fillStyle = dotBase;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  };

  drawDot(x + w * 0.2, y + h * 0.34, w * 0.065);
  drawDot(x + w * 0.42, y + h * 0.26, w * 0.075);
  drawDot(x + w * 0.72, y + h * 0.32, w * 0.065);
  drawDot(x + w * 0.32, y + h * 0.46, w * 0.06);
  drawDot(x + w * 0.58, y + h * 0.44, w * 0.06);

  ctx.fillStyle = stemColor;
  ctx.fillRect(x + w * 0.32, y + h / 2, w * 0.36, h * 0.5);

  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.arc(x + w * 0.4, y + h * 0.6, w * 0.1, 0, Math.PI * 2);
  ctx.arc(x + w * 0.6, y + h * 0.6, w * 0.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x + w * 0.42, y + h * 0.6, w * 0.04, 0, Math.PI * 2);
  ctx.arc(x + w * 0.62, y + h * 0.6, w * 0.04, 0, Math.PI * 2);
  ctx.fill();

  if (Math.floor(frame / 10) % 2 === 0) {
    ctx.clearRect(x, y + h - 2, w, 2);
  }
}

function drawBackground(ctx) {
  ctx.fillStyle = COLORS.sky;
  ctx.fillRect(0, 0, view.w, view.h);

  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';

  const cloud = (cx, cy, s) => {
    ctx.beginPath();
    ctx.arc(cx, cy, 30 * s, 0, Math.PI * 2);
    ctx.arc(cx + 40 * s, cy + 10 * s, 40 * s, 0, Math.PI * 2);
    ctx.arc(cx - 40 * s, cy + 10 * s, 40 * s, 0, Math.PI * 2);
    ctx.fill();
  };

  const offset = gameState.cameraX * 0.2;
  const w = view.w + 400;

  for(let i = 0; i < 3; i++) {
    let x = (200 + i * 500 - offset) % w;
    if (x < -200) x += w;
    cloud(x, 150 + (i%2)*50, 1.0 + (i%2)*0.2);
  }
}

function drawSkyDog(ctx, dog, frame) {
  const px = Math.max(1, Math.floor(dog.size * 0.12));
  const bodyW = 16 * px;
  const bodyH = 9 * px;
  const step = Math.sin((dog.stepOffset ?? 0) + frame * 0.5) * px * 2;
  const isCocker = dog.kind === 'cocker';

  const colors = {
    outline: '#0b0b0b',
    fur: '#c88a3a',
    furDark: '#a56a2a',
    ear: '#4a3320',
    muzzle: '#2b221b',
    highlight: '#e4b46a'
  };

  if (isCocker) {
    colors.fur = '#1f1f1f';
    colors.furDark = '#0e0e0e';
    colors.ear = '#131313';
    colors.muzzle = '#2c2c2c';
    colors.highlight = '#2b2b2b';
  }

  const p = (x, y, w, h, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(x * px, y * px, w * px, h * px);
  };

  ctx.save();
  ctx.translate(dog.x + bodyW, dog.y);
  ctx.scale(-1, 1);

  // Outline base removed to avoid dark backdrop

  // Body
  p(2, 3, 9, 5, colors.fur);
  p(2, 3, 9, 1, colors.highlight);
  p(2, 7, 9, 1, colors.furDark);

  // Neck + head
  p(10, 3, 2, 3, colors.fur);
  p(11, 1, 5, 5, colors.fur);
  p(11, 1, 5, 1, colors.highlight);

  // Ear + cheek
  p(12, 0, 2, 2, colors.ear);
  p(12, 2, 1, 1, colors.outline);
  if (isCocker) {
    p(10, 3, 3, 6, colors.ear);
    p(9, 4, 1, 4, colors.ear);
    p(11, 8, 2, 1, colors.ear);
    p(10, 9, 1, 1, colors.ear);
  }

  // Muzzle + nose
  p(14, 3, 3, 2, colors.muzzle);
  p(16, 4, 1, 1, colors.outline);

  // Eye
  p(13, 2, 1, 1, colors.outline);
  if (isCocker) {
    p(10, 1, 6, 2, '#2b2b2b');
    p(11, 2, 1, 1, '#57b8f0');
    p(15, 2, 1, 1, '#57b8f0');
    p(9, 2, 1, 1, '#2b2b2b');
  }

  if (!dog.isFollower) {
    // Halo
    ctx.save();
    ctx.strokeStyle = '#f5d742';
    ctx.lineWidth = Math.max(1, px * 0.9);
    ctx.beginPath();
    ctx.ellipse(13.5 * px, -2.6 * px, 3.4 * px, 1.3 * px, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Tail curl
  const tailWag = Math.sin((dog.stepOffset ?? 0) + frame * 0.6) > 0 ? 1 : 0;
  p(0 + tailWag, 2, 3, 2, colors.furDark);
  p(-1 + tailWag, 2, 1, 1, colors.furDark);
  p(1 + tailWag, 1, 1, 1, colors.furDark);
  if (isCocker) {
    p(0 + tailWag, 4, 2, 1, colors.furDark);
    p(2 + tailWag, 3, 1, 1, colors.furDark);
  }

  // Legs (pixel + step)
  p(4, 8 + (step > 0 ? 1 : 0), 2, 3, colors.furDark);
  p(11, 8 + (step < 0 ? 1 : 0), 2, 3, colors.furDark);
  p(4, 11 + (step > 0 ? 1 : 0), 2, 1, colors.furDark);
  p(11, 11 + (step < 0 ? 1 : 0), 2, 1, colors.furDark);
  if (isCocker) {
    p(3, 8 + (step > 0 ? 1 : 0), 1, 2, colors.furDark);
    p(13, 8 + (step < 0 ? 1 : 0), 1, 2, colors.furDark);
  }

  // Collar accent
  p(11, 4, 4, 1, '#f5d742');

  ctx.restore();
}

/**
 * Game Logic
 */
class Level {
  constructor() {
    this.map = {};
    this.enemies = [];
    this.generatedX = 0;
    this.groundY = 10;
    this.questionCooldown = 0;

    // 初回生成範囲を広く取る（画面幅の3倍）
    this.updateMap(view.w * 3);
  }

  updateMap(targetX) {
    // 先読み範囲を広めに (+50)
    const targetTileX = Math.ceil(targetX / TILE_SIZE) + 50;

    // 生成
    while (this.generatedX < targetTileX) {
      this.generateColumn(this.generatedX);
      this.generatedX++;
    }

    // クリーンアップ
    const deleteThreshold = Math.floor((gameState.cameraX - view.w) / TILE_SIZE);
    this.enemies = this.enemies.filter(e => e.x > gameState.cameraX - view.w);

    // 古いマップデータの削除（軽量化）
    if (this.generatedX % 100 === 0) {
      for (let x in this.map) {
        if (parseInt(x) < deleteThreshold) {
          delete this.map[x];
        }
      }
    }
  }

  generateColumn(x) {
    this.map[x] = [];
    // 初期化: 全てを0(空気)にする
    for(let y=0; y<ROWS; y++) this.map[x][y] = 0;

    // スタート地点〜安全圏
    if (x < 30) {
      for(let y=this.groundY; y<ROWS; y++) this.map[x][y] = 1;
      return;
    }

    if (this.questionCooldown > 0) {
      this.questionCooldown--;
    }

    // 地面の高さをたまに変える
    if (Math.random() < 0.05) {
      this.groundY += Math.random() > 0.5 ? 1 : -1;
      this.groundY = Math.max(7, Math.min(13, this.groundY));
    }

    // 地面生成
    for(let y=this.groundY; y<ROWS; y++) this.map[x][y] = 1;

    // オブジェクト配置
    this.generateObjects(x, this.groundY);
  }

  generateObjects(x, groundY) {
    if (Math.random() < 0.06) {
      // ?ブロック
      this.map[x][groundY - 3] = 5;
      this.questionCooldown = 2;
      return;
    } else if (Math.random() < 0.05) {
      // 地上の障害物
      if (this.questionCooldown === 0) {
        if (Math.random() > 0.5) {
          const isTallPipe = Math.random() < 0.5;
          this.map[x][groundY-1] = 3;
          if (isTallPipe && groundY - 2 >= 0) {
            this.map[x][groundY-2] = 3;
          }
        } else {
          this.map[x][groundY-1] = 2;
        }
      }
    } else if (Math.random() < 0.05) {
      this.map[x][groundY-1] = 4;
    } else if (Math.random() < 0.05) {
      // ボトル（はさみと同じ収集系）
      this.map[x][groundY-2] = 7;
    } else if (Math.random() < 0.08) {
      // 空中の足場
      this.map[x][groundY-4] = 2;
    }

    // 敵
    if (Math.random() < 0.05) {
      this.enemies.push({
        x: x * TILE_SIZE,
        y: (groundY - 1) * TILE_SIZE,
        active: true
      });
    }
  }

  draw(ctx, frame) {
    const startCol = Math.floor(gameState.cameraX / TILE_SIZE);
    // 描画範囲を少し広めに取る（チラつき防止）
    const endCol = startCol + Math.ceil(view.w / TILE_SIZE) + 4;

    for (let x = startCol; x < endCol; x++) {
      if (!this.map[x]) continue;
      for (let y = 0; y < ROWS; y++) {
        const type = this.map[x][y];
        if (type && type !== 0) {
          drawBlock(ctx, x * TILE_SIZE - gameState.cameraX, y * TILE_SIZE, type, x, y);
        }
      }
    }

    this.enemies.forEach(e => {
      if (e.active && e.x > gameState.cameraX - TILE_SIZE && e.x < gameState.cameraX + view.w) {
        drawEnemy(ctx, e.x - gameState.cameraX, e.y, frame);
      }
    });
  }

  isSolid(x, y) {
    if (x < 0) return true;
    if (!this.map[x]) return false;
    if (y < 0 || y >= ROWS) return false;
    const tile = this.map[x][y];
    return tile !== undefined && tile !== 0 && tile !== 2 && tile !== 4 && tile !== 7;
  }
}

let player = {
  x: 0, y: 0, vx: 0, vy: 0, w: 0, h: 0, grounded: false, dead: false, knockback: 0
};

let level;
let animationId;
let frameCount = 0;
let skyDogs = [];
let skyDogCooldown = 0;
let lastSkyDogKind = null;
let pipePeople = [];
let pipePersonCooldown = 0;
let pipeCats = [];
let beerMugs = [];
let beerTimer = 0;
let beerFoam = [];
let invincibleTimer = 0;
let bubbleTimer = 0;
let hearts = [];
let stars = [];
let bottles = [];
let ghosts = [];

function collectScissorAt(tileX, tileY) {
  if (!level) return false;
  const column = level.map[tileX];
  if (!column) return false;
  if (column[tileY] !== 2) return false;
  column[tileY] = 0;
  gameState.score += 10;
  document.getElementById('score').innerText = `SCORE: ${gameState.score}`;
  return true;
}

function collectScissorsInBounds() {
  const left = Math.floor((player.x + 4) / TILE_SIZE);
  const right = Math.floor((player.x + player.w - 4) / TILE_SIZE);
  const top = Math.floor((player.y + 4) / TILE_SIZE);
  const bottom = Math.floor((player.y + player.h - 4) / TILE_SIZE);

  for (let x = left; x <= right; x++) {
    for (let y = top; y <= bottom; y++) {
      collectScissorAt(x, y);
    }
  }
}

function collectBottleAt(tileX, tileY) {
  if (!level) return false;
  const column = level.map[tileX];
  if (!column) return false;
  if (column[tileY] !== 7) return false;
  column[tileY] = 0;
  gameState.score += BOTTLE_SCORE;
  document.getElementById('score').innerText = `SCORE: ${gameState.score}`;
  return true;
}

function collectBottlesInBounds() {
  const left = Math.floor((player.x + 4) / TILE_SIZE);
  const right = Math.floor((player.x + player.w - 4) / TILE_SIZE);
  const top = Math.floor((player.y + 4) / TILE_SIZE);
  const bottom = Math.floor((player.y + player.h - 4) / TILE_SIZE);

  for (let x = left; x <= right; x++) {
    for (let y = top; y <= bottom; y++) {
      collectBottleAt(x, y);
    }
  }
}
function handleQuestionBlock(tileX, tileY) {
  if (!level) return;
  const column = level.map[tileX];
  if (!column) return;
  if (column[tileY] !== 5) return;

  column[tileY] = 6;
  const itemX = tileX * TILE_SIZE + TILE_SIZE * 0.075;
  const itemY = tileY * TILE_SIZE - TILE_SIZE * 0.65;
  const roll = Math.random();
  if (roll < 0.35) {
    spawnHeart(itemX, itemY);
    gameState.score += HEART_SCORE;
  } else if (roll < 0.7) {
    spawnStar(itemX, itemY);
    gameState.score += STAR_SCORE;
  } else {
    spawnGhost(itemX, itemY);
    gameState.score += GHOST_SCORE;
  }
  document.getElementById('score').innerText = `SCORE: ${gameState.score}`;
}

function handleSkullAt(tileX, tileY, prevBottom) {
  if (!level || player.dead) return;
  const column = level.map[tileX];
  if (!column) return;
  if (column[tileY] !== 4) return;

  const tileTop = tileY * TILE_SIZE;
  if (player.vy >= 0 && prevBottom <= tileTop + TILE_SIZE * 0.2) {
    column[tileY] = 0;
    gameState.score += SKULL_SCORE;
    document.getElementById('score').innerText = `SCORE: ${gameState.score}`;
    player.vy = JUMP_FORCE * SKULL_JUMP_MULTIPLIER;
  } else {
    // Side hits on the jump pad should not kill the player.
    player.knockback = Math.max(player.knockback, 20);
  }
}

function handleSkullsInBounds(prevBottom) {
  if (player.dead) return;
  const left = Math.floor((player.x + 4) / TILE_SIZE);
  const right = Math.floor((player.x + player.w - 4) / TILE_SIZE);
  const top = Math.floor((player.y + 4) / TILE_SIZE);
  const bottom = Math.floor((player.y + player.h - 4) / TILE_SIZE);

  for (let x = left; x <= right; x++) {
    for (let y = top; y <= bottom; y++) {
      handleSkullAt(x, y, prevBottom);
      if (player.dead) return;
    }
  }
}

function activateInvincibility() {
  invincibleTimer = INVINCIBLE_DURATION;
  bubbleTimer = BUBBLE_DURATION;
}

function isInvincible() {
  return invincibleTimer > 0;
}

function resetSkyDogs() {
  skyDogs = [];
  skyDogCooldown = 0;
  lastSkyDogKind = null;
}

function spawnSkyDog() {
  let kind = Math.random() < 0.5 ? 'cocker' : 'pixel';
  if (lastSkyDogKind && kind === lastSkyDogKind) {
    kind = lastSkyDogKind === 'cocker' ? 'pixel' : 'cocker';
  }
  lastSkyDogKind = kind;
  const sizeBase = Math.max(18, TILE_SIZE * 0.7);
  const size = kind === 'pixel' ? sizeBase * 1.12 : sizeBase * 0.8;
  const { min, max } = SKY_DOG_CONFIG.yRange();
  const y = min + Math.random() * (max - min);
  const speed = SKY_DOG_CONFIG.baseSpeed() * (0.9 + Math.random() * 0.3);
  const leader = {
    x: view.w + size * 2,
    y,
    size,
    kind,
    speed,
    stepOffset: Math.random() * Math.PI * 2
  };
  skyDogs.push(leader);
  if (kind === 'cocker') {
    skyDogs.push({
      x: leader.x + size * 2.1,
      y: leader.y + size * 0.06,
      size,
      kind,
      speed,
      stepOffset: leader.stepOffset + Math.PI * 0.4,
      isFollower: true
    });
  }
}

function updateSkyDogs() {
  if (invincibleTimer > 0) {
    if (skyDogCooldown < SKY_DOG_COOLDOWN_FRAMES) {
      skyDogCooldown = SKY_DOG_COOLDOWN_FRAMES;
    }
  } else {
    if (skyDogCooldown > 0) skyDogCooldown--;
    if (skyDogCooldown <= 0 && Math.random() < SKY_DOG_CHANCE) {
      spawnSkyDog();
      skyDogCooldown = SKY_DOG_COOLDOWN_FRAMES;
    }
  }
  const playerScreenX = player.x - gameState.cameraX;
  const playerScreenY = player.y;
  const playerScreenW = player.w;
  const playerScreenH = player.h;

  skyDogs.forEach(dog => {
    dog.x -= dog.speed;
    dog.stepOffset = (dog.stepOffset ?? 0) + 0.1;
    if (dog.collected) return;
    const dogW = dog.size * (dog.kind === 'cocker' ? 1.7 : 1.6);
    const dogH = dog.size * (dog.kind === 'cocker' ? 1.3 : 1.2);
    if (
      playerScreenX < dog.x + dogW &&
      playerScreenX + playerScreenW > dog.x &&
      playerScreenY < dog.y + dogH &&
      playerScreenY + playerScreenH > dog.y
    ) {
      activateInvincibility();
      dog.collected = true;
    }
  });
  skyDogs = skyDogs.filter(dog => !dog.collected && dog.x > -dog.size * 2);
}

function drawSkyDogs(ctx) {
  skyDogs.forEach(dog => drawSkyDog(ctx, dog, frameCount));
}

function drawPipePerson(ctx, person, frame) {
  const w = TILE_SIZE * 0.78;
  const h = TILE_SIZE * 1.3;
  const x = person.x - gameState.cameraX;
  const y = person.y;
  const ps = w / 10;
  const step = Math.sin((person.stepOffset ?? 0) + frame * 0.4) * ps;

  ctx.save();
  ctx.translate(x, y);

  // Hair (same framing as the main character)
  ctx.fillStyle = '#222';
  ctx.fillRect(ps * 2, ps * 0.6, ps * 6, ps * 4.6);
  ctx.fillRect(ps * 1.4, ps * 2.2, ps * 1.2, ps * 3.4);
  ctx.fillRect(ps * 7.4, ps * 2.2, ps * 1.2, ps * 3.4);
  // Bangs pulled from both sides with a deeper rounded center gap
  ctx.fillRect(ps * 2.0, ps * 1.2, ps * 2.3, ps * 2.8);
  ctx.fillRect(ps * 5.7, ps * 1.2, ps * 2.3, ps * 2.8);
  // carve a rounded dip in the middle
  ctx.fillRect(ps * 3.6, ps * 1.9, ps * 0.8, ps * 0.8);
  ctx.fillRect(ps * 4.6, ps * 1.9, ps * 0.8, ps * 0.8);
  ctx.fillRect(ps * 4.0, ps * 2.6, ps * 1.2, ps * 0.8);

  // Face
  ctx.fillStyle = '#FCD';
  ctx.fillRect(ps * 2, ps * 2.5, ps * 6, ps * 4.2);

  // Mouth
  ctx.fillStyle = '#c93a6a';
  ctx.fillRect(ps * 4.1, ps * 5.8, ps * 1.8, ps * 0.6);

  // Shirt (white)
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(ps * 1, ps * 6.8, ps * 8, ps * 4.2);

  // Arms + hands
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(ps * 0.4, ps * 7.2, ps * 1.2, ps * 3.2);
  ctx.fillRect(ps * 8.4, ps * 7.2, ps * 1.2, ps * 3.2);
  ctx.fillStyle = '#FCD';
  ctx.fillRect(ps * 0.4, ps * 10.2, ps * 1.2, ps * 0.9);
  ctx.fillRect(ps * 8.4, ps * 10.2, ps * 1.2, ps * 0.9);

  // Belly + collar
  ctx.fillStyle = '#e9e9e9';
  ctx.fillRect(ps * 2.2, ps * 7.4, ps * 5.6, ps * 2.6);
  ctx.fillStyle = '#d6d6d6';
  ctx.fillRect(ps * 4.3, ps * 7.2, ps * 1.4, ps * 0.8);

  // Shirt text
  ctx.fillStyle = '#1b1b1b';
  ctx.font = `bold ${Math.max(6, Math.floor(ps * 2.4))}px 'M PLUS Rounded 1c', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('ONO', ps * 5, ps * 9.2);

  // Pants
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(ps * 2, ps * 11.2 + step, ps * 2.4, ps * 3.6);
  ctx.fillRect(ps * 5.6, ps * 11.2 - step, ps * 2.4, ps * 3.6);

  // Shoes
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(ps * 1.6, ps * 14.4 + step, ps * 3.2, ps * 0.9);
  ctx.fillRect(ps * 5.2, ps * 14.4 - step, ps * 3.2, ps * 0.9);

  ctx.restore();
}

function drawBeerMug(ctx, mug) {
  const size = mug.size;
  const bodyW = size * 0.6;
  const bodyH = size * 0.8;
  const foamH = size * 0.22;
  const handleW = size * 0.2;
  const handleH = size * 0.45;

  ctx.save();
  ctx.translate(mug.x, mug.y);
  ctx.rotate(mug.rot);

  // Mug body
  ctx.fillStyle = '#f5c542';
  ctx.fillRect(-bodyW / 2, -bodyH / 2 + foamH * 0.3, bodyW, bodyH);
  ctx.fillStyle = '#e0a93a';
  ctx.fillRect(-bodyW / 2, -bodyH / 2 + foamH * 0.3, bodyW, bodyH * 0.18);

  // Foam
  ctx.fillStyle = '#fff4dc';
  ctx.fillRect(-bodyW / 2, -bodyH / 2, bodyW, foamH);

  // Handle
  ctx.fillStyle = '#f5c542';
  ctx.fillRect(bodyW / 2 - size * 0.02, -handleH / 2, handleW, handleH);
  ctx.clearRect(bodyW / 2 + handleW * 0.25, -handleH / 2 + handleH * 0.2, handleW * 0.5, handleH * 0.6);

  ctx.restore();
}

function drawPipeCat(ctx, cat, frame) {
  const w = TILE_SIZE * 0.7;
  const h = TILE_SIZE * 0.9;
  const x = cat.x - gameState.cameraX;
  const y = cat.y;
  const ps = w / 10;
  const tailWag = Math.sin((cat.stepOffset ?? 0) + frame * 0.6) > 0 ? 1 : 0;

  ctx.save();
  // Face the movement direction (right-to-left)
  ctx.translate(x + w, y);
  ctx.scale(-1, 1);

  // Body
  ctx.fillStyle = '#111111';
  ctx.fillRect(ps * 1.5, ps * 4, ps * 7, ps * 4);

  // Head
  ctx.fillRect(ps * 6.5, ps * 2.5, ps * 3, ps * 2.5);

  // Ears
  ctx.fillRect(ps * 6.3, ps * 1.8, ps * 1, ps * 1);
  ctx.fillRect(ps * 8.5, ps * 1.8, ps * 1, ps * 1);

  // Tail
  ctx.fillRect(ps * 0.5 + tailWag, ps * 4.2, ps * 1.4, ps * 0.8);
  ctx.fillRect(ps * 0.2 + tailWag, ps * 3.6, ps * 0.8, ps * 0.8);

  // Eyes
  ctx.fillStyle = '#ffd24a';
  ctx.fillRect(ps * 7.2, ps * 3.2, ps * 0.6, ps * 0.6);
  ctx.fillRect(ps * 8.4, ps * 3.2, ps * 0.6, ps * 0.6);

  ctx.restore();
}

function getGroundYAtX(worldX) {
  if (!level) return null;
  const tileX = Math.floor(worldX / TILE_SIZE);
  const column = level.map[tileX];
  if (!column) return null;
  for (let y = 0; y < ROWS; y++) {
    if (column[y] === 1) return y * TILE_SIZE;
  }
  return null;
}

function spawnBeerMugs() {
  beerMugs = [];
  beerFoam = [];
  for (let i = 0; i < BEER_MUG_COUNT; i++) {
    const size = Math.max(14, TILE_SIZE * (0.35 + Math.random() * 0.45));
    beerMugs.push({
      x: Math.random() * view.w,
      y: Math.random() * view.h,
      vx: (Math.random() * 2 - 1) * 2.4,
      vy: (Math.random() * 2 - 1) * 2.4,
      size,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() * 2 - 1) * 0.06
    });
  }
  const foamCount = Math.floor(BEER_MUG_COUNT * 2.2);
  for (let i = 0; i < foamCount; i++) {
    beerFoam.push({
      x: Math.random() * view.w,
      y: Math.random() * view.h,
      vx: (Math.random() * 2 - 1) * 1.6,
      vy: (Math.random() * 2 - 1) * 1.6,
      r: Math.max(2, TILE_SIZE * (0.06 + Math.random() * 0.08)),
      life: 1,
      drift: Math.random() * Math.PI * 2
    });
  }
  beerTimer = BEER_DURATION;
}

function updateBeerMugs() {
  if (beerTimer <= 0) return;
  beerTimer--;

  beerMugs.forEach(mug => {
    mug.x += mug.vx;
    mug.y += mug.vy;
    mug.rot += mug.vr;

    const margin = mug.size * 0.6;
    if (mug.x < -margin || mug.x > view.w + margin) mug.vx *= -1;
    if (mug.y < -margin || mug.y > view.h + margin) mug.vy *= -1;
  });

  beerFoam.forEach(foam => {
    foam.x += foam.vx;
    foam.y += foam.vy - 0.15;
    foam.vx *= 0.99;
    foam.vy *= 0.99;
    foam.life = Math.max(0, foam.life - 0.008);
    foam.drift += 0.05;
    const jitter = Math.sin(foam.drift) * 0.3;
    foam.x += jitter;
    const margin = foam.r * 2;
    if (foam.x < -margin || foam.x > view.w + margin) foam.vx *= -1;
    if (foam.y < -margin || foam.y > view.h + margin) foam.vy *= -1;
  });
}

function drawBeerMugs(ctx) {
  if (beerTimer <= 0) return;
  ctx.save();
  const fadeIn = Math.min(1, (BEER_DURATION - beerTimer) / 20);
  const fadeOut = Math.min(1, beerTimer / 20);
  ctx.globalAlpha = Math.min(fadeIn, fadeOut);
  beerMugs.forEach(mug => drawBeerMug(ctx, mug));
  beerFoam.forEach(foam => {
    if (foam.life <= 0) return;
    ctx.globalAlpha = Math.min(1, foam.life) * 0.9;
    ctx.beginPath();
    ctx.fillStyle = '#fff8ea';
    ctx.arc(foam.x, foam.y, foam.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function findPipeSpawnCandidate() {
  if (!level) return null;
  const startCol = Math.floor(gameState.cameraX / TILE_SIZE);
  const endCol = startCol + Math.ceil(view.w / TILE_SIZE) + 8;
  const rightBiasCol = startCol + Math.floor((endCol - startCol) * 0.6);
  const candidates = [];

  for (let x = startCol; x < endCol; x++) {
    if (x < rightBiasCol) continue;
    const column = level.map[x];
    if (!column) continue;
    for (let y = 0; y < ROWS; y++) {
      if (column[y] === 3) {
        const above = column[y - 1];
        if (y > 1 && (above === 0 || above === undefined)) {
          candidates.push({ x, y });
        }
      }
    }
  }

  if (!candidates.length) return null;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function spawnPipePerson() {
  const candidate = findPipeSpawnCandidate();
  if (!candidate) return false;
  const personH = TILE_SIZE * 1.4;
  const baseY = candidate.y * TILE_SIZE - personH - TILE_SIZE * PIPE_PERSON_FLOAT_OFFSET;
  const startY = candidate.y * TILE_SIZE - TILE_SIZE * PIPE_PERSON_FLOAT_OFFSET;
  const catH = TILE_SIZE * 0.9;
  const catBaseY = candidate.y * TILE_SIZE - catH + TILE_SIZE * PIPE_CAT_FLOAT_OFFSET;
  const catStartY = candidate.y * TILE_SIZE + TILE_SIZE * PIPE_CAT_FLOAT_OFFSET;
  pipePeople.push({
    x: candidate.x * TILE_SIZE + TILE_SIZE * 0.1,
    y: startY,
    baseY,
    startY,
    popProgress: 0,
    speed: -MOVE_SPEED * 0.25,
    stepOffset: Math.random() * Math.PI * 2
  });
  pipeCats.push({
    x: candidate.x * TILE_SIZE + TILE_SIZE * 0.9,
    y: catStartY,
    baseY: catBaseY,
    startY: catStartY,
    popProgress: 0,
    speed: -MOVE_SPEED * 0.25,
    stepOffset: Math.random() * Math.PI * 2
  });
  return true;
}

function updatePipePeople() {
  if (pipePersonCooldown > 0) pipePersonCooldown--;
  if (pipePersonCooldown <= 0 && Math.random() < PIPE_PERSON_CHANCE) {
    if (spawnPipePerson()) {
      pipePersonCooldown = PIPE_PERSON_COOLDOWN_FRAMES;
    }
  }

  const personW = TILE_SIZE * 0.78;
  const personH = TILE_SIZE * 1.3;
  pipePeople.forEach(person => {
    if (person.popProgress < 1) {
      person.popProgress = Math.min(1, person.popProgress + 0.08);
      const t = 1 - Math.pow(1 - person.popProgress, 2);
      person.y = person.startY + (person.baseY - person.startY) * t;
    } else {
      const groundY = getGroundYAtX(person.x + personW * 0.5);
      if (groundY !== null) {
        person.y = groundY - personH - TILE_SIZE * PIPE_PERSON_FLOAT_OFFSET;
      }
      person.x += person.speed;
    }
    if (!person.hit &&
        player.x < person.x + personW &&
        player.x + player.w > person.x &&
        player.y < person.y + personH &&
        player.y + player.h > person.y) {
      person.hit = true;
      spawnBeerMugs();
      pipePersonCooldown = PIPE_PERSON_HIT_COOLDOWN_FRAMES;
    }
  });

  const catH = TILE_SIZE * 0.9;
  pipeCats.forEach(cat => {
    if (cat.popProgress < 1) {
      cat.popProgress = Math.min(1, cat.popProgress + 0.1);
      const t = 1 - Math.pow(1 - cat.popProgress, 2);
      cat.y = cat.startY + (cat.baseY - cat.startY) * t;
    } else {
      const groundY = getGroundYAtX(cat.x + TILE_SIZE * 0.35);
      if (groundY !== null) {
        cat.y = groundY - catH + TILE_SIZE * PIPE_CAT_FLOAT_OFFSET;
      }
      cat.x += cat.speed;
    }
  });

  pipePeople = pipePeople.filter(person => person.x > gameState.cameraX - TILE_SIZE * 4);
  pipeCats = pipeCats.filter(cat => cat.x > gameState.cameraX - TILE_SIZE * 4);
}

function drawPipePeople(ctx) {
  pipePeople.forEach(person => drawPipePerson(ctx, person, frameCount));
}

function drawPipeCats(ctx) {
  pipeCats.forEach(cat => drawPipeCat(ctx, cat, frameCount));
}

function spawnHeart(x, y) {
  hearts.push({
    x,
    y,
    vy: -TILE_SIZE * 0.18,
    popTimer: 18,
    bobOffset: Math.random() * Math.PI * 2,
    collected: false
  });
}

function updateHearts() {
  const playerWorldX = player.x;
  const playerWorldY = player.y;
  const playerWorldW = player.w;
  const playerWorldH = player.h;

  hearts.forEach(heart => {
    if (heart.popTimer > 0) {
      heart.y += heart.vy;
      heart.popTimer--;
      if (heart.popTimer === 0) {
        heart.vy = 0;
      }
    }

    if (heart.collected) return;
    const size = TILE_SIZE * 0.85;
    const hx = heart.x;
    const hy = heart.y;
    if (
      playerWorldX < hx + size &&
      playerWorldX + playerWorldW > hx &&
      playerWorldY < hy + size &&
      playerWorldY + playerWorldH > hy
    ) {
      heart.collected = true;
    }
  });

  hearts = hearts.filter(heart => !heart.collected && heart.x > gameState.cameraX - TILE_SIZE * 2);
}

function drawHeart(ctx, x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#ff5d6c';
  ctx.beginPath();
  ctx.moveTo(size * 0.5, size * 0.9);
  ctx.bezierCurveTo(size * 0.1, size * 0.55, 0, size * 0.2, size * 0.28, size * 0.18);
  ctx.bezierCurveTo(size * 0.45, size * 0.16, size * 0.5, size * 0.32, size * 0.5, size * 0.32);
  ctx.bezierCurveTo(size * 0.5, size * 0.32, size * 0.55, size * 0.16, size * 0.72, size * 0.18);
  ctx.bezierCurveTo(size, size * 0.2, size * 0.9, size * 0.55, size * 0.5, size * 0.9);
  ctx.fill();
  ctx.restore();
}

function drawStar(ctx, x, y, size, frame) {
  const pulse = 1 + Math.sin(frame * 0.12) * 0.06;
  const outer = size * 0.5 * pulse;
  const inner = outer * 0.45;
  const cx = x + size * 0.5;
  const cy = y + size * 0.52;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#ffd24a';
  ctx.strokeStyle = '#ffb236';
  ctx.lineWidth = Math.max(1, size * 0.08);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const radius = i % 2 === 0 ? outer : inner;
    const angle = (Math.PI / 5) * i - Math.PI / 2;
    const px = Math.cos(angle) * radius;
    const py = Math.sin(angle) * radius;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function drawGhost(ctx, x, y, size, frame, bobOffset) {
  const wobble = Math.sin(frame * 0.08 + bobOffset) * size * 0.03;
  const cx = x + size * 0.5;
  const cy = y + size * 0.5 + wobble;
  const r = size * 0.34;

  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#d7d7d7';
  ctx.lineWidth = Math.max(1, size * 0.04);
  ctx.beginPath();
  ctx.arc(cx, cy, r, Math.PI, 0);
  ctx.lineTo(cx + r, cy + r * 1.2);
  ctx.quadraticCurveTo(cx + r * 0.5, cy + r * 1.55, cx, cy + r * 1.2);
  ctx.quadraticCurveTo(cx - r * 0.5, cy + r * 1.55, cx - r, cy + r * 1.2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath();
  ctx.ellipse(cx - r * 0.35, cy + r * 0.15, r * 0.22, r * 0.3, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + r * 0.35, cy + r * 0.15, r * 0.22, r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff7aa2';
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.6, r * 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSparkleStar(ctx, x, y, size, frame, phase) {
  const pulse = 1 + Math.sin(frame * 0.25 + phase) * 0.2;
  const outer = size * 0.5 * pulse;
  const inner = outer * 0.45;
  const cx = x + size * 0.5;
  const cy = y + size * 0.5;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(255, 242, 190, 0.98)';
  ctx.strokeStyle = 'rgba(255, 184, 77, 0.98)';
  ctx.lineWidth = Math.max(1, size * 0.12);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const radius = i % 2 === 0 ? outer : inner;
    const angle = (Math.PI / 5) * i - Math.PI / 2;
    const px = Math.cos(angle) * radius;
    const py = Math.sin(angle) * radius;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#fff2b8';
  ctx.beginPath();
  ctx.arc(0, 0, outer * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBottleSparkles(ctx, bx, by, size, frame, seed) {
  const sparkleCount = 5;
  const baseY = by + size * 1.49;
  for (let i = 0; i < sparkleCount; i++) {
    const phase = (seed + 1) * 0.15 + i * 1.3;
    const ox = (i - 2) * size * 0.24 + Math.sin(frame * 0.35 + phase) * size * 0.05;
    const oy = Math.cos(frame * 0.4 + phase) * size * 0.05;
    const s = size * (0.2 + (i % 2) * 0.06);
    drawSparkleStar(ctx, bx + size * 0.5 + ox - s * 0.5, baseY + oy - s * 0.5, s, frame, phase);
  }
}

function drawBottle(ctx, x, y, size) {
  const bodyW = size * 0.62;
  const bodyH = size * 0.76;
  const neckW = bodyW * 0.42;
  const neckH = size * 0.18;
  const pumpH = size * 0.16;

  const roundedRect = (rx, ry, rw, rh, rr) => {
    const r = Math.min(rr, rw * 0.5, rh * 0.5);
    ctx.beginPath();
    ctx.moveTo(rx + r, ry);
    ctx.arcTo(rx + rw, ry, rx + rw, ry + rh, r);
    ctx.arcTo(rx + rw, ry + rh, rx, ry + rh, r);
    ctx.arcTo(rx, ry + rh, rx, ry, r);
    ctx.arcTo(rx, ry, rx + rw, ry, r);
    ctx.closePath();
  };

  ctx.save();
  ctx.translate(x + size * 0.5, y + size * 0.12);

  ctx.fillStyle = '#f2f2f2';
  ctx.strokeStyle = '#cfcfcf';
  ctx.lineWidth = Math.max(1, size * 0.05);

  // Pump head
  roundedRect(-neckW * 0.8, -pumpH, neckW * 1.6, pumpH * 0.6, size * 0.08);
  ctx.fill();
  ctx.stroke();
  roundedRect(neckW * 0.4, -pumpH * 0.75, neckW * 0.9, pumpH * 0.35, size * 0.08);
  ctx.fill();
  ctx.stroke();

  // Neck
  roundedRect(-neckW * 0.5, 0, neckW, neckH, size * 0.08);
  ctx.fill();
  ctx.stroke();

  // Body
  ctx.fillStyle = '#e2e2e2';
  roundedRect(-bodyW * 0.5, neckH, bodyW, bodyH, size * 0.12);
  ctx.fill();
  ctx.stroke();

  // Label mark
  drawSinceMark(ctx, 0, neckH + bodyH * 0.55, bodyW * 0.9);

  ctx.restore();
}

function drawHearts(ctx, frame) {

function drawStars(ctx, frame) {

    const size = TILE_SIZE * 0.85;

function drawGhosts(ctx, frame) {

function drawBottles(ctx, frame) {

    const bob = Math.sin(frame * 0.08 + bottle.bobOffset) * TILE_SIZE * 0.03;
    const size = TILE_SIZE * 0.85;

    drawBottleSparkles(ctx, bx, by, size, frame, idx);

    drawBottle(ctx, bx, by, size);

function drawSinceMark(ctx, cx, cy, size) {
  const text = 'SINCE';
  const fontSize = Math.max(8, Math.floor(size * 0.24));
  const spacing = size * 0.08;

  ctx.save();
  ctx.fillStyle = 'rgba(70, 70, 70, 0.7)';
  ctx.font = `700 ${fontSize}px 'M PLUS Rounded 1c', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  let total = 0;
  const widths = text.split('').map(letter => {
    const w = ctx.measureText(letter).width;
    total += w;
    return w;
  });
  total += spacing * (text.length - 1);

  let x = cx - total / 2;
  text.split('').forEach((letter, i) => {
    const w = widths[i];
    ctx.fillText(letter, x + w / 2, cy);
    x += w + spacing;
  });

  ctx.restore();
}

function setOverlayState(state, scoreValue = 0) {
  if (state === 'start') {
    overlayScene.style.display = 'block';
    overlayVideo.style.display = 'block';
    overlayMessageEl.innerText = '';
    overlayMessageEl.style.display = 'none';
    overlaySubtextEl.innerHTML = '';
    overlaySubtextEl.style.display = 'none';
    overlayScorePanel.classList.remove('visible');
    startBtn.innerText = 'START!';
  } else if (state === 'gameover') {
    overlayScene.style.display = 'none';
    overlayVideo.style.display = 'none';
    overlayMessageEl.innerText = 'GAME OVER';
    overlayMessageEl.style.display = 'block';
    overlaySubtextEl.innerHTML = '<img src="assets/start_character.png" alt="character" class="overlay-subtext-icon"><span class="overlay-subtext-text">何を言っているのか分かりません</span>';
    overlaySubtextEl.style.display = 'flex';
    overlayScoreValue.innerText = scoreValue;
    overlayScorePanel.classList.add('visible');
    startBtn.innerText = 'もう一度チャレンジする';
  }
}

function init() {
  // ゲーム開始時: ここで画面サイズに合わせて定数を確定させる
  resize();
  calculateConstants();

  player.w = TILE_SIZE * 0.9;
  player.h = TILE_SIZE * 1.5;
  player.x = TILE_SIZE * 4;
  player.y = TILE_SIZE * 5;
  player.vx = MOVE_SPEED;
  player.vy = 0;
  player.dead = false;
  player.knockback = 0;

  level = new Level();
  resetSkyDogs();
  pipePeople = [];
  pipePersonCooldown = 0;
  pipeCats = [];
  beerMugs = [];
  beerTimer = 0;
  beerFoam = [];
  invincibleTimer = 0;
  bubbleTimer = 0;
  hearts = [];
  stars = [];
  bottles = [];
  ghosts = [];
  gameState.score = 0;
  gameState.distance = 0;
  gameState.cameraX = 0;
  gameState.isRunning = true;
  jumpPressed = false;

  startScreenEl.style.display = 'none';

  gameLoop();
}

function updatePhysics() {
  if (player.dead) {
    player.vy += GRAVITY;
    player.y += player.vy;
    return;
  }

  if (invincibleTimer > 0) invincibleTimer--;
  if (bubbleTimer > 0) bubbleTimer--;

  // マップ更新: 画面外も余裕を持って生成
  level.updateMap(player.x + view.w);

  if (player.knockback > 0) {
    player.vx = -MOVE_SPEED * 0.6;
    player.knockback--;
  } else {
    player.vx = MOVE_SPEED;
  }

  if (jumpPressed && player.grounded) {
    player.vy = JUMP_FORCE;
    player.grounded = false;
    jumpPressed = false;
  }

  player.vy += GRAVITY;
  const prevX = player.x;
  const prevY = player.y;
  player.x += player.vx;
  player.y += player.vy;

  gameState.distance = Math.floor(player.x / TILE_SIZE);
  document.getElementById('dist').innerText = `${gameState.distance}`;

  player.grounded = false;

  const getTile = (px, py) => ({
    x: Math.floor(px / TILE_SIZE),
    y: Math.floor(py / TILE_SIZE)
  });

  // 接地判定
  if (player.vy >= 0) {
    const bl = getTile(player.x + 5, player.y + player.h);
    const br = getTile(player.x + player.w - 5, player.y + player.h);

    if (level.isSolid(bl.x, bl.y) || level.isSolid(br.x, br.y)) {
      const blockTop = bl.y * TILE_SIZE;
      if (player.y + player.h <= blockTop + player.vy + TILE_SIZE/2) {
        player.y = blockTop - player.h;
        player.vy = 0;
        player.grounded = true;
      }
    }
  } else {
    const tl = getTile(player.x + 5, player.y);
    const tr = getTile(player.x + player.w - 5, player.y);
    if (level.isSolid(tl.x, tl.y) || level.isSolid(tr.x, tr.y)) {
      handleQuestionBlock(tl.x, tl.y);
      handleQuestionBlock(tr.x, tr.y);
      player.y = (tl.y + 1) * TILE_SIZE;
      player.vy = 0;
    }
  }

  // 衝突判定（右側）
  const tr = getTile(player.x + player.w, player.y + 5);
  const br = getTile(player.x + player.w, player.y + player.h - 5);

  const isBlockingTile = (tile) => {
    const column = level.map[tile.x];
    if (!column) return false;
    const type = column[tile.y];
    if (type === undefined || type === 0) return false;
    if (type === 2) {
      collectScissorAt(tile.x, tile.y);
      return false;
    }
    if (type === 7) {
      collectBottleAt(tile.x, tile.y);
      return false;
    }
    return type === 1 || type === 3 || type === 5 || type === 6;
  };

  if (isBlockingTile(tr) || isBlockingTile(br)) {
    let stepped = false;
    if (player.vy >= 0) {
      const maxStep = Math.floor(TILE_SIZE * 0.45);
      for (let dy = 1; dy <= maxStep; dy++) {
        const testTop = getTile(player.x + player.w, player.y - dy + 5);
        const testBottom = getTile(player.x + player.w, player.y - dy + player.h - 5);
        if (!isBlockingTile(testTop) && !isBlockingTile(testBottom)) {
          player.y -= dy;
          stepped = true;
          break;
        }
      }
    }
    if (!stepped) {
      player.x = prevX;
    }
  }

  const prevBottom = prevY + player.h;
  handleSkullsInBounds(prevBottom);
  collectScissorsInBounds();
  collectBottlesInBounds();
  updateHearts();
  updateStars();
  updateBottles();
  updateGhosts();

  // 落下死: マップ底の少し下まで落ちたら死亡
  const abyssY = ROWS * TILE_SIZE + TILE_SIZE * 2;
  if (player.y > abyssY) die();

  // カメラ追従
  const targetCamX = player.x - view.w * 0.2;
  gameState.cameraX = targetCamX;
  if (gameState.cameraX < 0) gameState.cameraX = 0;

  // 敵との当たり判定
  level.enemies.forEach(e => {
    if(!e.active) return;

    if (player.x < e.x + TILE_SIZE &&
        player.x + player.w > e.x &&
        player.y < e.y + TILE_SIZE &&
        player.y + player.h > e.y) {

      if (player.vy > 0 && player.y + player.h < e.y + TILE_SIZE * 0.6) {
        e.active = false;
        player.vy = JUMP_FORCE * 0.6;
        gameState.score += 100;
        document.getElementById('score').innerText = `SCORE: ${gameState.score}`;
      } else if (!isInvincible()) {
        die();
      } else {
        e.active = false;
        gameState.score += 100;
        document.getElementById('score').innerText = `SCORE: ${gameState.score}`;
      }
    }
  });

}

function die() {
  if(player.dead) return;

  player.dead = true;
  player.vy = JUMP_FORCE;
  player.vx = 0;
  const finalScore = gameState.score;

  setTimeout(() => {
    gameState.isRunning = false;
    setOverlayState('gameover', finalScore);
    startScreenEl.style.display = 'flex';
    gameState.score = 0;
    gameState.distance = 0;
    document.getElementById('score').innerText = 'SCORE: 0';
    document.getElementById('dist').innerText = '0';
  }, 1500);
}

function gameLoop() {
  if (!gameState.isRunning) return;

  ctx.clearRect(0, 0, view.w, view.h);

  drawBackground(ctx);
  updatePhysics();
  updateSkyDogs();
  updatePipePeople();
  updateBeerMugs();
  drawSkyDogs(ctx);
  level.draw(ctx, frameCount);
  drawPipePeople(ctx);
  drawPipeCats(ctx);
  drawHearts(ctx, frameCount);
  drawStars(ctx, frameCount);
  drawGhosts(ctx, frameCount);
  drawBottles(ctx, frameCount);
  drawPlayer(ctx, player.x - gameState.cameraX, player.y, frameCount);
  drawBeerMugs(ctx);

  frameCount++;
  animationId = requestAnimationFrame(gameLoop);
}

// ボタンイベント: クリックとタッチ両方に対応
startBtn.addEventListener('click', (e) => { e.preventDefault(); init(); });
startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); init(); });
setOverlayState('start');

const container = document.getElementById('game-container');
const handleInput = (e) => {
  if(!gameState.isRunning) return;
  if(e.type !== 'mousedown') e.preventDefault(); // タッチ時の重複イベント防止
  jumpPressed = true;
};
container.addEventListener('touchstart', handleInput, {passive: false});
container.addEventListener('mousedown', handleInput);

window.addEventListener('keydown', e => {
  if(e.code === 'Space' || e.key === 'ArrowUp') handleInput(e);
});
window.addEventListener('keyup', e => {
  if(e.code === 'Space' || e.key === 'ArrowUp') jumpPressed = false;
});

container.addEventListener('touchend', () => jumpPressed = false);
container.addEventListener('mouseup', () => jumpPressed = false);
</script>
